[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-file-manager"
version = "1.0.0"
description = "AI文件管理工具 - 批量创建文件夹、重命名文件、导出Excel"
requires-python = ">=3.8"
dependencies = [
    "pypinyin>=0.49.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "scikit-image>=0.21.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
]
[project.scripts]
ai-file-manager = "main:main"