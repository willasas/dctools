[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dctools"
version = "1.0.0"
description = "AI文件管理工具，提供文件夹创建、文件重命名、去重和Excel导出功能"
authors = [{ name = "willasas", email = "willasas@example.com" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Windows",
]

[project.dependencies]
pypinyin = "==0.50.0"
pandas = "==2.2.0"
openpyxl = "==3.1.2"
numpy = "==1.26.0"
scipy = "==1.11.0"

[project.optional-dependencies]
image = [
    "opencv-python==4.8.0",
    "Pillow==10.0.0",
    "scikit-image==0.22.0",
]
audio = [
    "librosa==0.10.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.cmdclass]
test = "pytest"
